services:
  db:
    image: postgres:18-alpine
    container_name: db
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 1s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_DB: stackfolio_db
      POSTGRES_USER: stackfolio_user
      POSTGRES_PASSWORD: stackfolio_password
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - '5432:5432'

volumes:
  pgdata:
